# Сборка Android-приложения (APK) из собранного index.html.
# Запускается при изменении игры или папки mobile/ в main и вручную (Actions → Run workflow).
# Тег вида app-v0.3.1 дополнительно публикует APK в GitHub Releases — оттуда игроки скачивают файл.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['app-v*']
    paths: ['index.html', 'mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей и копирование игры в приложение
        working-directory: mobile
        run: |
          npm ci
          npm run sync:android

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — собирается отладочный APK. Для раздачи игрокам нужен постоянный ключ (см. mobile/README.md)."
          fi

      - name: Сборка APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease --no-daemon
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/grim-pda-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: grim-pda-apk-${{ github.run_number }}
          path: dist/*.apk

      - name: Публикация в Releases (для тегов app-v*)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
