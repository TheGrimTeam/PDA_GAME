        <!-- 3.5. КАРТА ЗОНЫ -->
        <div id="view-map" class="view">
            <h3>🗺 КАРТА ЗОНЫ</h3>
            <div id="map-target-hint" class="map-target-hint" style="display:none;"></div>

            <!-- Экран карты -->
            <div id="map-container" style="touch-action: none; position:relative; width:100%; height:320px; background:#020b02; border:2px solid var(--term-green); border-radius:6px; overflow:hidden; box-shadow:inset 0 0 15px rgba(57,255,20,0.15);">
                <!-- СЕТКА КООРДИНАТ 5x5 (А1–Д5): строится в renderMapGrid(), цель сюжета подсвечивается -->
                <div id="map-grid" class="map-grid"></div>

                <!-- Слои маркеров рендерится через JS -->
                <div id="map-markers-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:10;"></div>
            </div>

            <!-- Инфо-карточка локации -->
            <div id="map-info-card" class="profile-card" style="margin-top:10px; padding:10px; min-height:65px; border-color:var(--term-green);">
                <div id="map-info-title" style="font-weight:bold; color:var(--term-green); font-size:1.05rem;">Сектора: буква — столбец, цифра — ряд</div>
                <div id="map-info-desc" style="font-size:0.9rem; color:#aaa; margin-top:4px;">Например, «Д2» — правый столбец, второй ряд сверху. Цель сюжетного задания подсвечивается 🎯. Свои метки (тайники, опасные места) можно поставить в редакторе ниже — они хранятся только на этом телефоне.</div>
            </div>

            <!-- Переключатель Режима Редактора -->
            <button id="btn-toggle-map-editor" onclick="toggleMapEditor()" style="width:100%; margin-top:8px; border-color:var(--quest-color); color:var(--quest-color); font-size:0.95rem;">✏️ МОИ МЕТКИ: ДОБАВИТЬ / ИЗМЕНИТЬ</button>

            <!-- Панель управления редактором (скрыта по умолчанию) -->
            <div id="map-editor-panel" class="profile-card" style="display:none; margin-top:10px; border-color:var(--quest-color); background:rgba(255,183,0,0.03);">
                <h4 style="color:var(--quest-color); border-bottom:1px dashed var(--quest-color); padding-bottom:4px; margin-bottom:8px; text-align:center;">🛠 НАСТРОЙКА ЛОКАЦИЙ ЗОНЫ</h4>

                <div style="display:flex; flex-direction:column; gap:6px; font-size:0.9rem;">
                    <div><label style="color:#ccc;">Название метки:</label><input type="text" id="edit-marker-name" style="width:100%; background:var(--term-dark); border:1px solid var(--term-green); color:var(--term-green); padding:4px;" placeholder="Название объекта..."></div>
                    <div><label style="color:#ccc;">Иконка (Emoji):</label><input type="text" id="edit-marker-icon" oninput="onIconInputUpdate()" style="width:100%; background:var(--term-dark); border:1px solid var(--term-green); color:var(--term-green); padding:4px;" placeholder="🏰, 📻, ☣️, 💀, 📍..."></div>
                    <div>
                        <label style="color:#ccc;">Цвет обводки метки:</label>
                        <select id="edit-marker-color" style="width:100%; background:var(--term-dark); border:1px solid var(--term-green); color:var(--term-green); padding:4px; font-family:'VT323',monospace; font-size:1.05rem;">
                            <option value="var(--term-green)">🟢 Зеленый (База / Нейтралы)</option>
                            <option value="var(--trade-color)">🔵 Голубой (Связь / Торговля)</option>
                            <option value="var(--quest-color)">🟡 Оранжевый (Важный объект)</option>
                            <option value="var(--bandit-color)">🔴 Красный (Опасность / Бандиты)</option>
                            <option value="var(--rad-color)">⚠️ Желтый (Аномалия / Радиация)</option>
                            <option value="#b026ff">🟣 Фиолетовый (Секретная зона)</option>
                            <option value="#ffffff">⚪ Белый (Нейтральный)</option>
                        </select>
                    </div>
                    <div><label style="color:#ccc;">Описание:</label><textarea id="edit-marker-desc" style="width:100%; background:var(--term-dark); border:1px solid var(--term-green); color:var(--term-green); padding:4px; height:50px;" placeholder="Описание объекта..."></textarea></div>
                </div>

                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button onclick="saveSelectedMarker()" style="flex:1; padding:6px; border-color:var(--term-green); color:var(--term-green);">💾 СОХРАНИТЬ</button>
                    <button onclick="addNewMapMarker()" style="flex:1; padding:6px; border-color:var(--trade-color); color:var(--trade-color);">➕ СОЗДАТЬ</button>
                    <button onclick="deleteSelectedMarker()" class="btn-danger" style="flex:1; padding:6px;">🗑 УДАЛИТЬ</button>
                </div>
                <button onclick="resetMapMarkersToDefault()" style="width:100%; margin-top:6px; font-size:0.8rem; padding:4px; border-color:#777; color:#aaa;">🔄 СБРОСИТЬ МЕТКИ ПО УМОЛЧАНИЮ</button>

                <!-- ЗАГРУЗКА СОБСТВЕННОЙ КАРТЫ С ТЕЛЕФОНА -->
                <div style="margin-top:12px; border-top:1px dashed var(--quest-color); padding-top:8px;">
                    <label style="color:var(--trade-color); font-weight:bold; display:block; margin-bottom:4px; text-align:center;">🖼 ФОНОВЫЙ РИСУНОК КАРТЫ</label>
                    <input type="file" id="map-bg-file-input" accept="image/*" onchange="uploadCustomMapBg(event)" style="display:none;">
                    <button onclick="document.getElementById('map-bg-file-input').click()" style="width:100%; border-color:var(--trade-color); color:var(--trade-color); font-size:0.95rem;">📷 ВЫБРАТЬ КАРТЫ ИЗ ГАЛЕРЕИ ТЕЛЕФОНА</button>
                    <button onclick="resetCustomMapBg()" style="width:100%; margin-top:4px; font-size:0.8rem; padding:3px; border-color:#666; color:#888;">🗑 УДАЛИТЬ ФОН КАРТЫ</button>
                </div>
            </div>
        </div>

                <!-- 3.6. КАМЕРА ПДА (ТАКТИЧЕСКОЕ ФОТО) -->
