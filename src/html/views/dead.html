        <div id="view-dead" class="view">

                <b style="color:var(--rad-color);">⚠️ ИНФЕКЦИЯ ВИРУСА В КРОВИ</b>
                <div id="dead-infection-timer" style="font-size:1.1rem; color:#fff; margin-top:5px;">Осталось времени на лечение: 05:00</div>
            </div>
            <h2 class="danger" style="text-align:center; font-size:2.5rem; margin-top:20px; animation: blink 1.5s infinite;">ВЫ МЕРТВЫ</h2>

            <div style="display:flex; gap: 10px; margin-bottom: 10px;">
                <button onclick="showHealQR()" style="flex:1;" class="btn-hero">🟢 ЛЕЧЕНИЕ</button>
                <button onclick="showRobQR()" style="flex:1;" class="btn-danger">🔴 ОГРАБИТЬ</button>
            </div>
            <div style="margin-bottom: 15px;">
                <button onclick="showSurvivorQRModal()" style="width:100%; border-color:var(--rad-color); color:var(--rad-color); background:rgba(0,255,100,0.05);" class="btn-hero">☣️ ПОКАЗАТЬ QR ЗОМБИ (ОХОТА)</button>
            </div>

            <!-- Место для генерации QR кода -->
            <div id="corpse-qr-container" style="display:none; background:#fff; padding:10px; margin: 15px auto; width:190px; height:190px; text-align:center; border-radius:6px; overflow:hidden; position:relative; box-sizing:border-box;"></div>
            <div id="corpse-qr-desc" style="text-align:center; font-size:0.95rem; color:#fff; margin-bottom:15px; display:none;"></div>

            <!-- Кнопки подтверждения -->
            <button id="btn-confirm-heal" onclick="confirmHeal()" style="width:100%; display:none; border-color:var(--hero-color); color:var(--hero-color); margin-bottom: 15px;">ВСТАТЬ (МЕНЯ ВЫЛЕЧИЛИ 20% HP)</button>
            <button id="btn-confirm-rob" onclick="confirmRob()" style="width:100%; display:none; border-color:var(--bandit-color); color:var(--bandit-color); margin-bottom: 15px;">МАРОДЕР ЗАБРАЛ ЛУТ (ОЧИСТИТЬ)</button>

            <hr style="border-top:1px dashed #555; margin: 20px 0;">
            <p style="text-align:center; color:var(--text-dim); font-size:0.9rem; margin-bottom:5px;">Или дойдите до точки возрождения (<span id="dead-respawn-hint">База</span>) и отсканируйте код:</p>
            <div id="qr-reader-dead" style="display:none;"></div>
            <button id="btn-dead-scan" onclick="startDeadScan()" style="width:100%; border-color:#ffcc00; color:#ffcc00;">ВКЛЮЧИТЬ СКАНЕР БАЗЫ</button>
            <div class="debug-input" id="admin-manual-dead-box" style="display:none; margin-top:15px;">
                <input type="text" id="dead-manual-code" placeholder="npc_base / npc_bandit_base" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitDeadManualCode();}">
                <button type="button" id="btn-dead-manual-enter" onclick="submitDeadManualCode()">ВВОД</button>
            </div>
        </div>
