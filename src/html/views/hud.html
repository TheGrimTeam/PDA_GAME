        <div id="hud">
            <!-- Строка состояния в стиле Pip-Boy: сегменты с разделителями -->
            <div class="pb-stats">
                <div class="pb-seg"><span class="pb-lbl">HP</span><span><span id="hp-val">100</span><span id="hp-max-val" class="pb-dim">/100</span></span></div>
                <div class="pb-seg"><span class="pb-lbl">ЕДА</span><span id="hunger-val">100</span></div>
                <div class="pb-seg"><span class="pb-lbl">ВЕС</span><span><span id="inv-val">0</span><span class="pb-dim">/</span><span id="inv-max" class="pb-dim">15</span></span></div>
            </div>
            <!-- Шкала радиации: заполнение «сжигает» максимум HP -->
            <div class="pb-rads">
                <span class="pb-lbl">РАД</span>
                <div class="pb-radbar"><div id="rad-fill" class="pb-radfill"></div></div>
                <span class="pb-radnum"><span id="rad-val">0</span><span id="rad-max-val" class="pb-dim">/40</span></span>
                <span class="pb-caps"><span class="pb-lbl">КРЫШКИ</span> <span id="score-val">0</span> <span class="cap cap-lg" title="крышки"></span></span>
            </div>
            <!-- КНОПКИ БЫСТРОГО ДОСТУПА -->
            <div class="hud-row pb-quick">
                <button onclick="quickUseItem('hp')">❤ ЛЕЧЕНИЕ</button>
                <button onclick="quickUseItem('rad')" class="pb-rad-btn">☢ АНТИРАД</button>
                <button onclick="quickUseItem('food')">🍖 ЕДА</button>
                <button onclick="declareDeath()" class="btn-danger">💀 УБИТ</button>
            </div>
        </div>
