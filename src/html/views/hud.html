        <div id="hud">
            <!-- Строка состояния: крупные блоки в рамках (стиль Pip-Boy) -->
            <div class="pb-grid">
                <div class="pb-box"><div class="pb-lbl">HP</div><div class="pb-val"><span id="hp-val">100</span><span id="hp-max-val" class="pb-dim">/100</span></div></div>
                <div class="pb-box"><div class="pb-lbl">ЕДА</div><div class="pb-val"><span id="hunger-val">100</span></div></div>
                <div class="pb-box"><div class="pb-lbl">ВЕС</div><div class="pb-val"><span id="inv-val">0</span><span class="pb-dim">/</span><span id="inv-max" class="pb-dim">15</span></div></div>
                <!-- Радиация «сжигает» максимум HP -->
                <div class="pb-box pb-rad-box">
                    <div class="pb-lbl"><span>РАДИАЦИЯ</span><span class="pb-radnum"><span id="rad-val">0</span><span id="rad-max-val" class="pb-dim">/40</span></span></div>
                    <div class="pb-radbar"><div id="rad-fill" class="pb-radfill"></div></div>
                </div>
                <div class="pb-box pb-caps-box"><div class="pb-lbl"><span>КРЫШКИ</span><span class="cap" title="крышки"></span></div><div class="pb-val"><span id="score-val">0</span></div></div>
            </div>
            <!-- Уровень и опыт -->
            <div class="pb-xp" onclick="switchView('profile')" title="Уровень и перки — в профиле">
                <span class="pb-xp-lvl">УР <b id="xp-level">1</b></span>
                <div class="pb-xpbar"><div id="xp-fill"></div></div>
                <span id="xp-text" class="pb-xp-text">0/100 XP</span>
                <span id="xp-points" class="pb-xp-points" style="display:none;">★ ПЕРК</span>
            </div>
            <!-- КНОПКИ БЫСТРОГО ДОСТУПА -->
            <div class="hud-row pb-quick">
                <button onclick="quickUseItem('hp')">❤ ЛЕЧЕНИЕ</button>
                <button onclick="quickUseItem('rad')" class="pb-rad-btn">☢ АНТИРАД</button>
                <button onclick="quickUseItem('food')">🍖 ЕДА</button>
                <button onclick="declareDeath()" class="btn-danger">💀 УБИТ</button>
            </div>
        </div>
