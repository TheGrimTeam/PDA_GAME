        <div id="hud">
            <!-- Жизненные показатели: число + полоска. Крупно и ярко — только когда опасно (класс pb-alert) -->
            <div class="pb-grid">
                <div class="pb-box" id="hud-hp-box">
                    <div class="pb-lbl"><span>HP</span><span class="pb-num"><span id="hp-val">100</span><span id="hp-max-val" class="pb-dim">/100</span></span></div>
                    <div class="pb-bar pb-bar-hp"><div id="hp-fill"></div></div>
                </div>
                <div class="pb-box" id="hud-food-box">
                    <div class="pb-lbl"><span>ЕДА</span><span class="pb-num"><span id="hunger-val">100</span><span id="hunger-max-val" class="pb-dim">/100</span></span></div>
                    <div class="pb-bar pb-bar-food"><div id="hunger-fill"></div></div>
                </div>
                <!-- Радиация «сжигает» максимум HP -->
                <div class="pb-box pb-rad-box" id="hud-rad-box">
                    <div class="pb-lbl"><span>РАД</span><span class="pb-num"><span id="rad-val">0</span><span id="rad-max-val" class="pb-dim">/40</span></span></div>
                    <div class="pb-radbar"><div id="rad-fill" class="pb-radfill"></div></div>
                </div>
            </div>
            <!-- Вторая строка: уровень и опыт, вес, крышки -->
            <div class="pb-line2">
                <div class="pb-xp" onclick="switchView('profile')" title="Уровень и перки — в профиле">
                    <span class="pb-xp-lvl">УР <b id="xp-level">1</b></span>
                    <div class="pb-xpbar"><div id="xp-fill"></div></div>
                    <span id="xp-text" class="pb-xp-text">0/100 XP</span>
                    <span id="xp-points" class="pb-xp-points" style="display:none;">★ ПЕРК</span>
                </div>
                <span class="pb-chip" id="hud-weight" title="Вес рюкзака">⚖ <span id="inv-val">0</span><span class="pb-dim">/</span><span id="inv-max" class="pb-dim">15</span></span>
                <span class="pb-chip pb-caps" title="КРЫШКИ"><span class="cap"></span><span id="score-val">0</span><span class="pb-sr">КРЫШКИ</span></span>
            </div>
            <!-- Быстрые действия: в скобках — сколько подходящих предметов в рюкзаке -->
            <div class="hud-row pb-quick">
                <button id="quick-hp" title="Вылечиться: аптечка из рюкзака" onclick="quickUseItem('hp')">❤ HP <b id="quick-hp-n" class="pb-qn">0</b></button>
                <button id="quick-rad" title="Снять радиацию: антирад из рюкзака" onclick="quickUseItem('rad')" class="pb-rad-btn">☢ РАД <b id="quick-rad-n" class="pb-qn">0</b></button>
                <button id="quick-food" title="Поесть из рюкзака" onclick="quickUseItem('food')">🍖 ЕДА <b id="quick-food-n" class="pb-qn">0</b></button>
                <button onclick="declareDeath()" class="btn-danger pb-dead-btn" title="Меня убили">💀 УБИТ</button>
            </div>
        </div>
